<div class="consortium-menu">
  <div class="menu-header">
    <div class="menu-title-block">
      <app-label text="Seleccionar Consorcio" class="menu-title" color="#1F2937"></app-label>
      <app-label text="Elige el consorcio que deseas administrar" class="menu-subtitle" color="#6B7280"></app-label>
    </div>
    <div class="menu-user-card" *ngIf="currentUser">
      <span class="menu-user-role">{{ currentUser.rol }}</span>
      <strong>{{ currentUser.nombre }} {{ currentUser.apellido }}</strong>
      <small>{{ currentUser.correo_electronico }}</small>
    </div>
  </div>
  <app-consortium-grid
    [consortia]="consortia"
    (consortiumCreated)="loadConsortia()"
    (consortiumDeleted)="loadConsortia()">
  </app-consortium-grid>
</div>
