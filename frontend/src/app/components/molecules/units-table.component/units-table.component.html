<div class="units-table-container">
  <table class="units-table">
    <thead>
      <tr>
        <th>Número</th>
        <th>Consorcio</th>
        <th>Tipo</th>
        <th>Estado</th>
        <th>Superficie (m²)</th>
        <th>Propietario</th>
        <th class="actions-column">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let unit of units">
        <td class="numero">{{ unit.numero }}</td>
        <td>{{ unit.consorcio || '-' }}</td>
        <td>{{ unit.tipo_de_unidad }}</td>
        <td>
          <span class="status-badge">{{ unit.estado_de_vivienda }}</span>
        </td>
        <td>{{ unit.superficie }}</td>
        <td>{{ unit.propietario || '-' }}</td>
        <td class="actions-column">
          <button class="icon-button" title="Editar unidad" (click)="onEdit(unit)">
            <app-icon iconHref="assets/img/sprites.svg#settings" size="18" color="#4B5563"></app-icon>
          </button>
          <button class="icon-button danger" title="Eliminar unidad" (click)="onDelete(unit)">
            <app-icon iconHref="assets/img/sprites.svg#trash" size="18" color="#B91C1C"></app-icon>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
