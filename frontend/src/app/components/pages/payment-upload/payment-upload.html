<div class="payment-upload-page">
  <div class="page-header">
    <div>
      <app-label text="Cargar Nuevo Pago" fontSize="32px" color="#1F2937"></app-label>
      <app-label text="Completa la información del pago" fontSize="16px" color="#6B7280"></app-label>
    </div>
  </div>

  <form class="form-card" [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <label class="form-field">
        <span>CUIT Consorcio</span>
        <input type="text" formControlName="cuitConsorcio" readonly />
      </label>

      <label class="form-field">
        <span>Número de unidad</span>
        <input type="number" formControlName="numeroUnidad" placeholder="101" />
      </label>

      <label class="form-field">
        <span>DNI Propietario</span>
        <input type="text" formControlName="dniPropietario" placeholder="12345678" />
      </label>

      <label class="form-field">
        <span>Monto</span>
        <input type="number" step="0.01" formControlName="monto" placeholder="12000" />
      </label>

      <label class="form-field">
        <span>Estado</span>
        <select formControlName="estadoPago">
          <option *ngFor="let estado of statusOptions" [value]="estado">{{ estado }}</option>
        </select>
      </label>

      <label class="form-field">
        <span>Fecha de pago</span>
        <input type="date" formControlName="fechaPago" />
      </label>
    </div>

    <div class="form-actions">
      <button type="button" class="cancel-button" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="submit-button" [disabled]="paymentForm.invalid">Guardar Pago</button>
    </div>
  </form>
</div>
