<div class="expenses-page">
  <div class="page-header">
    <div>
      <app-label text="Gastos Comunes" fontSize="32px" color="#1F2937"></app-label>
      <app-label text="Registro de gastos del consorcio" fontSize="16px" color="#6B7280"></app-label>
    </div>
    <button class="new-expense-btn" [routerLink]="['/dashboard', consortiumName, 'gastos', 'carga-de-gasto']">
      <app-icon iconHref="assets/img/sprites.svg#plus" size="16" color="#FFFFFF"></app-icon>
      <span>Nuevo Gasto</span>
    </button>
  </div>

  <div class="balance-cards">
    <div class="balance-card total">
      <div class="card-icon blue">
        <app-icon iconHref="assets/img/sprites.svg#dollar" size="24" color="#2563EB"></app-icon>
      </div>
      <div class="card-content">
        <app-label text="Total Gastos" fontSize="14px" color="#6B7280"></app-label>
        <app-label [text]="formatCurrency(totalSpends)" fontSize="24px" color="#1F2937"></app-label>
      </div>
    </div>

    <div class="balance-card paid">
      <div class="card-icon green">
        <app-icon iconHref="assets/img/sprites.svg#dollar" size="24" color="#10B981"></app-icon>
      </div>
      <div class="card-content">
        <app-label text="Pagados" fontSize="14px" color="#6B7280"></app-label>
        <app-label [text]="formatCurrency(paidSpends)" fontSize="24px" color="#1F2937"></app-label>
      </div>
    </div>

    <div class="balance-card pending">
      <div class="card-icon orange">
        <app-icon iconHref="assets/img/sprites.svg#dollar" size="24" color="#F59E0B"></app-icon>
      </div>
      <div class="card-content">
        <app-label text="Pendientes" fontSize="14px" color="#6B7280"></app-label>
        <app-label [text]="formatCurrency(pendingSpends)" fontSize="24px" color="#1F2937"></app-label>
      </div>
    </div>
  </div>

  <!-- Barra de filtros -->
  <div class="filters-bar" style="display:flex; gap:16px; margin: 16px 0;">
    <input type="month" [(ngModel)]="filtroPeriodo" (ngModelChange)="aplicarFiltros()" placeholder="Período">

    <select [(ngModel)]="filtroTipo" (ngModelChange)="aplicarFiltros()">
      <option value="">Todos los tipos</option>
      <option value="Mantenimiento">Mantenimiento</option>
      <option value="Servicios">Servicios</option>
      <option value="Limpieza">Limpieza</option>
      <option value="Seguridad">Seguridad</option>
      <option value="Administración">Administración</option>
      <option value="Otros">Otros</option>
    </select>

    <select [(ngModel)]="filtroEstado" (ngModelChange)="aplicarFiltros()">
      <option value="">Todos los estados</option>
      <option value="Pendiente">Pendiente</option>
      <option value="Pagado">Pagado</option>
    </select>

    <button (click)="limpiarFiltros()">Limpiar filtros</button>
  </div>

  <div class="table-section">
    <app-spending-table
      [spends]="spends"
      [ordenActual]="ordenActual"
      [direccion]="direccion"
      (ordenar)="ordenarPor($event)"
      (statusChanged)="onStatusChanged($event)"
      (editSpend)="onEditSpend($event)"
      (deleteSpend)="onDeleteSpend($event)">
    </app-spending-table>
  </div>
</div>

<div class="modal-backdrop" *ngIf="showDeleteModal" (click)="closeDeleteModal()"></div>
<div class="modal delete-modal" *ngIf="showDeleteModal" role="dialog" aria-modal="true">
  <div class="modal-header">
    <app-label text="Eliminar gasto" fontSize="22px" color="#1F2937"></app-label>
    <button class="icon-button" title="Cerrar" (click)="closeDeleteModal()">
      <app-icon iconHref="assets/img/sprites.svg#x" size="18" color="#6B7280"></app-icon>
    </button>
  </div>
  <div class="delete-content">
    <div class="delete-icon">
      <app-icon iconHref="assets/img/sprites.svg#alert" size="26" color="#B91C1C"></app-icon>
    </div>
    <p class="delete-title">¿Seguro que quieres eliminar este gasto?</p>
    <p class="delete-subtitle">
      Se eliminará el gasto <strong>{{ spendToDelete?.descripcion }}</strong>.
    </p>
  </div>
  <div class="modal-actions">
    <button type="button" class="cancel-button" (click)="closeDeleteModal()">Cancelar</button>
    <button type="button" class="submit-button danger" (click)="confirmDelete()">Eliminar</button>
  </div>
</div>
