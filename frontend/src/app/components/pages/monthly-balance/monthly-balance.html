<div class="monthly-balance-page">
  <div class="page-header">
    <div>
      <app-label text="Saldo Mensual" fontSize="32px" color="#1F2937"></app-label>
      <app-label text="Resumen mensual por unidad" fontSize="16px" color="#6B7280"></app-label>
    </div>
    <div class="header-actions">
      <button class="secondary-button" (click)="onAddPayment()">
        <app-icon iconHref="assets/img/sprites.svg#plus" size="16" color="#2563EB"></app-icon>
        <span>Cargar pago</span>
      </button>
      <button class="primary-button" (click)="openCreateModal()">
        <app-icon iconHref="assets/img/sprites.svg#plus" size="16" color="#FFFFFF"></app-icon>
        <span>Nuevo saldo</span>
      </button>
    </div>
  </div>

  <div class="table-section">
    <app-monthly-balance-table
      [balances]="balances"
      (editBalance)="openEditModal($event)"
      (deleteBalance)="onDeleteBalance($event)">
    </app-monthly-balance-table>
  </div>
</div>

<div class="modal-backdrop" *ngIf="showFormModal" (click)="closeFormModal()"></div>
<div class="modal" *ngIf="showFormModal" role="dialog" aria-modal="true">
  <div class="modal-header">
    <app-label [text]="isEditMode ? 'Editar saldo mensual' : 'Nuevo saldo mensual'" fontSize="22px" color="#1F2937"></app-label>
    <button class="icon-button" title="Cerrar" (click)="closeFormModal()">
      <app-icon iconHref="assets/img/sprites.svg#x" size="18" color="#6B7280"></app-icon>
    </button>
  </div>
  <form class="modal-form" [formGroup]="form" (ngSubmit)="submitForm()">
    <label class="form-field">
      <span>Número de unidad</span>
      <input type="number" formControlName="numeroUnidad" />
    </label>
    <label class="form-field">
      <span>Consorcio</span>
      <input type="text" formControlName="consorcio" readonly />
    </label>
    <label class="form-field">
      <span>Mes</span>
      <input type="date" formControlName="mesAnio" />
    </label>
    <label class="form-field">
      <span>Saldo inicial</span>
      <input type="number" step="0.01" formControlName="saldoInicial" />
    </label>
    <label class="form-field">
      <span>Total gastos</span>
      <input type="number" step="0.01" formControlName="totalGastos" />
    </label>
    <label class="form-field">
      <span>Total pagos</span>
      <input type="number" step="0.01" formControlName="totalPagos" />
    </label>
    <label class="form-field full">
      <span>Fecha cierre</span>
      <input type="date" formControlName="fechaCierre" />
    </label>
    <div class="modal-actions">
      <button type="button" class="cancel-button" (click)="closeFormModal()">Cancelar</button>
      <button type="submit" class="submit-button">Guardar</button>
    </div>
  </form>
</div>

<div class="modal-backdrop" *ngIf="showDeleteModal" (click)="closeDeleteModal()"></div>
<div class="modal delete-modal" *ngIf="showDeleteModal" role="dialog" aria-modal="true">
  <div class="modal-header">
    <app-label text="Eliminar saldo mensual" fontSize="22px" color="#1F2937"></app-label>
    <button class="icon-button" title="Cerrar" (click)="closeDeleteModal()">
      <app-icon iconHref="assets/img/sprites.svg#x" size="18" color="#6B7280"></app-icon>
    </button>
  </div>
  <div class="delete-content">
    <div class="delete-icon">
      <app-icon iconHref="assets/img/sprites.svg#alert" size="26" color="#B91C1C"></app-icon>
    </div>
    <p class="delete-title">¿Seguro que quieres eliminar este saldo?</p>
    <p class="delete-subtitle">
      Se eliminará el saldo del mes <strong>{{ balanceToDelete?.mesAnio }}</strong>.
    </p>
  </div>
  <div class="modal-actions">
    <button type="button" class="cancel-button" (click)="closeDeleteModal()">Cancelar</button>
    <button type="button" class="submit-button danger" (click)="confirmDelete()">Eliminar</button>
  </div>
</div>
